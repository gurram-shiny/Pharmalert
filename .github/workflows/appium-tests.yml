name: Appium tests
on: [workflow_dispatch]
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - run: npx expo prebuild --platform android --no-install
        working-directory: apps/app-frontend
      - run: |
          sed -i 's/<application /<application android:usesCleartextTraffic="true" /' app/src/main/AndroidManifest.xml
          NODE_ENV=production EXPO_NO_METRO_WORKSPACE_ROOT=1 ./gradlew assembleRelease -PreactNativeArchitectures=x86_64
        working-directory: apps/app-frontend/android
      - run: |
          npm install -g appium
          appium driver install uiautomator2
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          script: |
            npm run server > backend.log 2>&1 &
            appium > appium.log 2>&1 &
            timeout 60 bash -c 'until curl -fsS http://127.0.0.1:4723/status; do sleep 2; done'
            timeout 60 bash -c 'until curl -fsS http://127.0.0.1:8787/api/status; do sleep 2; done'
            PHARMALERT_APK="$PWD/apps/app-frontend/android/app/build/outputs/apk/release/app-release.apk" npm run test:mobile
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: appium-output
          path: |
            reports/evidence/appium.json
            appium.log
            backend.log
