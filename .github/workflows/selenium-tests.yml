name: Selenium tests
on: [push, pull_request, workflow_dispatch]
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: |
          npm run server > backend.log 2>&1 &
          npm run dev -w @pharmalert/web-frontend -- --host 127.0.0.1 > web.log 2>&1 &
          timeout 60 bash -c 'until curl -fsS http://127.0.0.1:5173/api/status; do sleep 2; done'
          npm run test:web
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selenium-output
          path: |
            reports/evidence/selenium.json
            backend.log
            web.log
